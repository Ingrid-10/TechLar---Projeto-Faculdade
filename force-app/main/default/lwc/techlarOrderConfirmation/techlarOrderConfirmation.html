<template>
    <lightning-card title="Venda concluída" icon-name="standard:task2" class="slds-m-bottom_medium">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <p class="slds-text-heading_small">Pedido {confirmation.orderNumber}</p>
            <p class="slds-m-top_xx-small">{confirmation.message}</p>
            <ul class="slds-m-top_medium summary">
                <li>Produtos: {formattedItems}</li>
                <li>Frete: {formattedFreight}</li>
                <li>Total: {formattedTotal}</li>
                <li>Recebimento: {confirmation.modalidadeRecebimento}</li>
            </ul>
            <div class="slds-m-top_medium">
                <lightning-button label="Abrir pedido" variant="brand" onclick={handleOpen}></lightning-button>
                <lightning-button class="slds-m-left_small" label="Nova venda" onclick={handleNew}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
