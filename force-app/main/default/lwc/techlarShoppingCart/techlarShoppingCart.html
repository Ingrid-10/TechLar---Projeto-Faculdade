<template>
    <lightning-card title="Carrinho" icon-name="standard:orders" class="slds-m-top_medium">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <p if:true={isEmpty} class="slds-text-color_weak">Nenhum produto adicionado.</p>

            <template if:false={isEmpty}>
                <ul class="cart-list">
                    <template for:each={rows} for:item="row">
                        <li key={row.pricebookEntryId} class="cart-row">
                            <div class="item-info">
                                <strong>{row.name}</strong>
                                <span>{row.formattedUnit}</span>
                            </div>
                            <lightning-input
                                type="number"
                                label="Qtd"
                                variant="label-hidden"
                                min="1"
                                value={row.quantity}
                                data-id={row.pricebookEntryId}
                                onchange={handleQty}
                            ></lightning-input>
                            <span class="line">{row.formattedLine}</span>
                            <lightning-button-icon
                                icon-name="utility:delete"
                                alternative-text="Remover"
                                data-id={row.pricebookEntryId}
                                onclick={handleRemove}
                            ></lightning-button-icon>
                        </li>
                    </template>
                </ul>

                <dl class="totals">
                    <div><dt>Subtotal</dt><dd>{formattedItemsTotal}</dd></div>
                    <div><dt>Frete</dt><dd>{formattedFreight}</dd></div>
                    <div class="grand"><dt>Total</dt><dd>{formattedGrandTotal}</dd></div>
                </dl>
            </template>
        </div>
    </lightning-card>
</template>
