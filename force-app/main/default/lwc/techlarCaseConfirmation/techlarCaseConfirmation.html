<template>
    <lightning-card title="Atendimento" icon-name="standard:case" class="slds-m-bottom_medium">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <p class="slds-text-heading_small">Case {confirmation.caseNumber}</p>
            <p class="slds-m-top_xx-small slds-text-color_weak">{confirmation.message}</p>

            <lightning-progress-indicator
                class="slds-m-top_medium"
                current-step={confirmation.status}
                type="path"
                variant="base"
            >
                <lightning-progress-step label="Novo" value="New"></lightning-progress-step>
                <lightning-progress-step label="Em análise" value="Working"></lightning-progress-step>
                <lightning-progress-step label="Resolvido" value="Closed"></lightning-progress-step>
            </lightning-progress-indicator>

            <dl class="detail-grid slds-m-top_medium">
                <div>
                    <dt>Status</dt>
                    <dd>{confirmation.statusLabel}</dd>
                </div>
                <div>
                    <dt>Fila</dt>
                    <dd>{confirmation.ownerName}</dd>
                </div>
                <div>
                    <dt>Cliente</dt>
                    <dd>{confirmation.accountName}</dd>
                </div>
                <div>
                    <dt>CPF</dt>
                    <dd>{confirmation.accountCpf}</dd>
                </div>
                <div>
                    <dt>Motivo</dt>
                    <dd>{confirmation.motivo}</dd>
                </div>
                <div>
                    <dt>Prioridade</dt>
                    <dd>{priorityLabel}</dd>
                </div>
                <div>
                    <dt>Pedido</dt>
                    <dd>{confirmation.orderNumber}</dd>
                </div>
                <div>
                    <dt>Produto</dt>
                    <dd>{confirmation.productName}</dd>
                </div>
                <div>
                    <dt>Data da compra</dt>
                    <dd>{purchaseDateLabel}</dd>
                </div>
                <div if:true={confirmation.resultado}>
                    <dt>Resultado</dt>
                    <dd>{confirmation.resultado}</dd>
                </div>
            </dl>

            <p class="slds-text-title_caps slds-m-top_medium">Descrição</p>
            <p class="description-box">{confirmation.description}</p>

            <template if:true={isOpen}>
                <lightning-combobox
                    class="slds-m-top_medium"
                    name="resultado"
                    label="Resultado"
                    value={resultado}
                    options={options}
                    onchange={handleResultado}
                ></lightning-combobox>
                <div if:true={errorMessage} class="slds-text-color_error slds-m-top_small">{errorMessage}</div>
                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Concluir atendimento"
                        variant="brand"
                        disabled={isSaving}
                        onclick={handleResolve}
                    ></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
