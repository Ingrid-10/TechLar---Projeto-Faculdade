<template>
    <lightning-card title="Compras" icon-name="standard:orders" class="slds-m-top_medium">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <p if:true={showEmptyCustomer} class="slds-text-color_weak">
                Pesquise um cliente para ver o histórico de compras da Sprint 1.
            </p>
            <p if:true={isLoading} class="slds-text-color_weak">Carregando pedidos...</p>
            <p if:true={showEmptyOrders} class="slds-text-color_weak">Este cliente ainda não possui pedidos TechLar.</p>

            <template for:each={rows} for:item="order">
                <section key={order.orderId} class="order-block">
                    <p class="order-title">Pedido {order.orderNumber} — {order.formattedDate}</p>
                    <p class="order-meta">{order.status} · {order.formattedTotal}</p>
                    <ul class="item-list">
                        <template for:each={order.items} for:item="item">
                            <li key={item.key} class="item-row">
                                <div>
                                    <strong>{item.productName}</strong>
                                    <span>{item.quantity} un. · {item.formattedLine}</span>
                                </div>
                                <lightning-button
                                    label={item.buttonLabel}
                                    variant={item.buttonVariant}
                                    data-item={item.orderItemId}
                                    onclick={handleSelect}
                                ></lightning-button>
                            </li>
                        </template>
                    </ul>
                </section>
            </template>
        </div>
    </lightning-card>
</template>
