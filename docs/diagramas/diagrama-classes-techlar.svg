<text x="1254" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#172033">Regras implementadas</text>
<text x="1254" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#172033">Transferência manual: Pedido feito →</text>
<text x="1254" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#172033">Em transporte → Concluída.</text>
<text x="1254" y="204" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#172033">A entrada só aumenta o destino</text>
<text x="1254" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#172033">quando o recebimento é confirmado.</text>
<rect x="1240" y="340" width="330" height="135" rx="8" fill="#FFF7E6" stroke="#9A5D00" stroke-width="1.4"/>
<text x="1254" y="365" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#172033">Reposição Agentforce</text>
<text x="1254" y="388" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#172033">Analisa Top 3 por loja em 30 dias.</text>
<text x="1254" y="406" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#172033">Abaixo de 5, repõe até 10.</text>
<text x="1254" y="424" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#172033">Origem: Estoque Central.</text>
<text x="1254" y="442" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#172033">Sem transferência parcial.</text>
